log_format upstreamlog '$remote_addr "$request" -> upstream=$upstream_addr status=$status';

server {
    listen 80;
    access_log /dev/stdout upstreamlog;

    # Docker's embedded DNS; re-resolve every 2 seconds so new replicas are found
    resolver 127.0.0.11 valid=2s ipv6=off;

    location / {
        set $backend "api:8000";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
